name: Deploy GitHub Pages

on:
  push:
    branches: [feat/registration-mvp, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Create public site configuration
        env:
          SUPABASE_URL: ${{ github.ref_name == 'main' && vars.PROD_SUPABASE_URL || vars.DEV_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ github.ref_name == 'main' && vars.PROD_SUPABASE_PUBLISHABLE_KEY || vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-public-config.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
